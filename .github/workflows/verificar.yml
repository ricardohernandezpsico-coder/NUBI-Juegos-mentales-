# Verificación automática en cada subida de código: si algo no compila o una prueba falla, GitHub lo avisa (✗ rojo en el
# commit) antes de que llegue al teléfono. Compila el C# de los juegos SIN Unity y compila la app Android con sus
# pruebas Kotlin (con un unityLibrary falso, ver tools/unity-falso.sh).
# NO reemplaza a `bash tools/verificar-todo.sh --instalar` en el PC de Ricardo: las pruebas de Unity (EditMode), el
# arranque de los 19 juegos y el export de Unity necesitan Unity con licencia y siguen corriendo allá.
name: Verificar

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verificar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  csharp:
    name: C# de los juegos (sin Unity)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Compilar los scripts de Unity
        run: dotnet build tools/unity-compile-check -v q

  app:
    name: App Android y pruebas Kotlin
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Plataforma de Android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "platforms;android-36.1" "build-tools;36.1.0" > /dev/null
      - name: unityLibrary falso
        run: bash tools/unity-falso.sh
      - uses: gradle/actions/setup-gradle@v5
      - name: Compilar y probar
        # KSP a veces cae con «ApplicationManager.getApplication() is null» cuando el compilador de Kotlin corre dentro del proceso de Gradle
        # (kotlin.compiler.execution.strategy=in-process, que gradle.properties usa por el PC de Ricardo). Aquí se usa el demonio de Kotlin y, si aun así
        # falla, se repite una vez: un fallo real de compilación o de una prueba vuelve a fallar y se informa igual.
        run: |
          for intento in 1 2; do
            bash ./gradlew :app:testDebugUnitTest --console=plain -Pkotlin.compiler.execution.strategy=daemon 2>&1 | tee gradle-ci.log
            [ "${PIPESTATUS[0]}" = 0 ] && exit 0
            echo "::warning::Gradle falló (intento $intento de 2)"
          done
          exit 1
      - name: Resumen del fallo (queda en las anotaciones, visibles sin iniciar sesión)
        if: failure()
        run: |
          # Los registros de GitHub piden iniciar sesión; las anotaciones no. Aquí se copian los errores de compilación, las pruebas que fallaron y el final del registro de Gradle.
          grep -a "^e: " gradle-ci.log | sort -u | head -15 | while IFS= read -r l; do echo "::error title=Compilación::${l:0:900}"; done
          grep -a " > .* FAILED$" gradle-ci.log | sort -u | head -20 | while IFS= read -r l; do echo "::error title=Prueba fallida::${l:0:900}"; done
          grep -a -A2 " > .* FAILED$" gradle-ci.log | grep -av " FAILED$" | grep -av "^--" | sort -u | head -15 | while IFS= read -r l; do echo "::error title=Motivo::${l:0:900}"; done
          grep -a -B2 -A12 "What went wrong" gradle-ci.log | head -6 | while IFS= read -r l; do echo "::warning title=Gradle::${l:0:500}"; done
          # La traza de cada prueba que falló (primeras líneas de su informe XML: ahí aparecen las excepciones «Suppressed»), también como anotación.
          python3 - <<'PY'
          import glob, html, re
          suites, fails, stray = [], [], []
          for f in sorted(glob.glob("app/build/test-results/testDebugUnitTest/*.xml")):
              s = open(f, encoding="utf-8", errors="replace").read()
              h = re.search(r'<testsuite name="([^"]+)"[^>]*timestamp="([^"]+)"[^>]*time="([^"]+)"', s)
              if h:
                  suites.append((h.group(2), h.group(1).split(".")[-1], h.group(3)))
              for m in re.finditer(r'<testcase name="([^"]+)" classname="([^"]+)"[^>]*>\s*<failure message="[^"]*"[^>]*>(.*?)</failure>', s, re.S):
                  fails.append((m.group(2).split(".")[-1], html.unescape(m.group(3)).strip()))
              for m in re.finditer(r'Exception in thread "([^"]*)" ([^\n]*)\n((?:[^\n]*\n){0,5})', html.unescape(s)):
                  stray.append((h.group(1).split(".")[-1] if h else f, m.group(1), m.group(2), m.group(3)))
          def enc(t): return t.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          suites.sort()
          names = [x[1] for x in suites]
          for cls, body in fails[:3]:
              lines = [l.strip() for l in body.splitlines() if l.strip()]
              out = []
              if cls in names:
                  k = names.index(cls)
                  out.append("ORDEN (los 8 anteriores y esta): " + " > ".join("%s (%ss)" % (x[1], x[2]) for x in suites[max(0, k - 8):k + 1]))
              hidden = []
              for n, l in enumerate(lines):
                  if l.startswith("Suppressed:") or l.startswith("Caused by:"):
                      hidden.append(" | ".join(lines[n:n + 6]))
              if hidden:
                  out.append("OCULTAS: " + " ## ".join(hidden[:4]))
              out.append("TRAZA: " + " | ".join(lines[:12]))
              if "=== HILOS ===" in body:
                  out.append("HILOS:\n" + body.split("=== HILOS ===", 1)[1])
              print("::error title=Detalle de %s::%s" % (cls, enc("\n".join(out))[:12000]))
          if stray:
              seen, rows = set(), []
              for cls, thread, head, rest in stray:
                  if head in seen:
                      continue
                  seen.add(head)
                  rows.append("[%s en %s] %s\n%s" % (thread, cls, head, rest))
              print("::error title=Excepciones sueltas (stderr de las pruebas)::%s" % enc("\n".join(rows[:6]))[:9000])
          PY
      - name: Guardar el informe de pruebas si algo falló
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: informe-pruebas-kotlin
          path: app/build/reports/tests/
